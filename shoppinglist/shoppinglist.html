<!DOCTYPE html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<link rel="icon" href="img/shopping-cart.png" type="image/png">	
<meta name="apple-mobile-web-app-capable" content="yes">

<title>Einkaufsliste</title>

<style>
*{box-sizing:border-box;}
body{
  font-family:system-ui;
  max-width:700px;
  margin:auto;
  padding:12px;
  background:#f2f2f2;
  font-size:18px;
  overflow-x: hidden;
}
	
h1{text-align:center;}

.toolbar{
  display:flex;
  flex-wrap:wrap;
  gap:8px;
}

button{
  flex:1;
  padding:12px;
  border:none;
  border-radius:10px;
  background:#2c7;
  color:white;
  cursor:pointer;
}
input.search{
  width:100%;
  padding:10px;
  border-radius:10px;
  border:1px solid #ccc;
}

ul{
  background:white;
  padding:5px;
  border-radius:12px;
}

/* Standard Flex-Setup */
li {
  display: flex;
  gap: 6px;           /* Abstand Bullet → Text */
  align-items: center; /* vertikal zentrieren */
  padding: 10px;
  margin-bottom: 4px;  /* Abstand zwischen Listenpunkten (Desktop) */
}

/* Mobile Anpassung für Smartphones */
@media (max-width: 600px) {
  .bullet {
    width: 40px;
    font-size: 30px;
  }
  
  li {
    gap: 12px;         /* Abstand Bullet → Text größer */
    margin-bottom: 8px; /* Abstand zwischen den Listenelementen größer */
    align-items: center;
  }
}

/* Sehr kleine Geräte <400px */
@media (max-width: 400px) {
  .bullet {
    width: 44px;
    font-size: 32px;
  }
  
  li {
    gap: 14px;
    margin-bottom: 10px; /* noch mehr Abstand für sehr kleine Screens */
    align-items: center;
  }
}

li.done span:nth-child(2){
  text-decoration:line-through;
  color:#999;
}

/* Groesse nur für Smartphones */
@media (max-width: 600px) {
  .bullet {
    width: 40px;       /* Platz für das Emoji und etwas Abstand */
    font-size: 30px;   /* gut sichtbare Größe für Touch-Bedienung */
  }
}

/* Basis-Definition für Desktop / Tablets */
.bullet {
  width: 24px;
  text-align: center;
  cursor: pointer;
}


input.edit{
  display:none;
  flex:1;
}

li.edit span{display:none;}
li.edit input.edit{display:inline;}
	
/* Bilder togglen */	
#qr, #lutz {
  display: none;
}

	
#toggle-kaufland:checked + #qr {
  display: block;
}

#toggle-lutz:checked + #lutz {
  display: block;
}
	
/* Duplikate */
li.duplicate {
  background: #ffb3b3;
}
	
	
li span:nth-child(2) {
  flex: 1;
  min-width: 0;           /* WICHTIG für Flexbox */
  overflow-wrap: break-word;
  word-break: break-word;
}
	
input.edit {
  flex: 1;
  min-width: 0;
}	
	
.hidden {
  display: none;
}
	
</style>
</head>

<body>

<div id="loading">⏳ Lade...</div>

<div id="loginBox" style="display:none">
  <h3>🔐 Login</h3>
  <input id="user" placeholder="Benutzername">
  <input id="pass" type="password" placeholder="Passwort">
  <button onclick="login()">Login</button>
  <p id="error" style="color:red;"></p>
</div>

<div id="app" style="display:none;">

<h1>🛒 Einkaufsliste</h1>

<div class="toolbar">
  <input class="search" placeholder="🔍 suchen..." oninput="filterItems(this.value)">
  <button onclick="clearDone()">🗑 erledigte löschen</button>
  <button onclick="toggleDone()">👁️ Erledigte anzeigen</button>
</div>

<h4 onclick="toggleList('aldi')">ALDI</h4>
<ul id="aldi"></ul>

<h4 onclick="toggleList('kaufland')">Kaufland</h4>
<input type="checkbox" id="toggle-kaufland">
<img id="qr" src="img/kauflandqrcode.jpeg" alt="QR-Code" style="max-width: 70%; height: auto;">QR-Code</img>
<ul id="kaufland"></ul>

<h4 onclick="toggleList('markt')">Markt</h4>
<ul id="markt"></ul>

<h4 onclick="toggleList('lidl')">LIDL</h4>
<ul id="lidl"></ul>

<h4 onclick="toggleList('dm')">DM</h4>
<ul id="dm"></ul>
	
<h4>Lutz</h4>
<input type="checkbox" id="toggle-lutz">
<img id="lutz" src="img/lutz.jpg" alt="Lutz" style="max-width: 100%; height: auto;">Kundennummer</img>

<h4 onclick="toggleList('andere')">Andere</h4>
<ul id="andere"></ul>

<script>
let dragged = null;

document.addEventListener("DOMContentLoaded", init);
async function init(){
  await silentLogin();
}

async function silentLogin(){
  try {
    const res = await fetch("api.php?action=check", {
      credentials: "include"
    });

    const data = await res.json();

    if(data.loggedIn){
      showApp();
      await load();
    } else {
      showLogin();
    }

  } catch(e){
    console.error("Silent Login Fehler:", e);
    showLogin();
  }
}

// Login ------------------
async function login(){
  const user = document.getElementById("user").value;
  const pass = document.getElementById("pass").value;

  const res = await fetch("api.php?action=login", {
    method: "POST",
    credentials: "include",
    headers: {"Content-Type":"application/json"},
    body: JSON.stringify({user, pass})
  });

  const data = await res.json();

  if(data.success){
    showApp();
    await load();
  } else {
    document.getElementById("error").textContent = "❌ Falsche Zugangsdaten";
  }
}

async function checkLogin(){
  try {
    const res = await fetch("api.php?action=check", {
      credentials: "include"
    });

    const data = await res.json();

    document.getElementById("loading").style.display = "none";

    if(data.loggedIn){
      document.getElementById("app").style.display = "block";
      load();
    } else {
      document.getElementById("loginBox").style.display = "block";
    }

  } catch(e){
    console.error("Login-Check Fehler:", e);
    document.getElementById("loading").style.display = "none";
    document.getElementById("loginBox").style.display = "block";
  }
}


function showApp(){
  document.getElementById("loading").style.display = "none";
  document.getElementById("loginBox").style.display = "none";
  document.getElementById("app").style.display = "block";
}

function showLogin(){
  document.getElementById("loading").style.display = "none";
  document.getElementById("loginBox").style.display = "block";
  document.getElementById("app").style.display = "none";
}

// ITEM ERSTELLEN ------------------
function createItem(text="", done=false, list="", id=null){
  const li = document.createElement("li")
  li.draggable = true

  if(id) li.dataset.id = id
  li.dataset.list = list

  li.innerHTML = `
    <span class="bullet">${done ? "✅" : "⬜"}</span>
    <span>${text || "___________________"}</span>
    <input class="edit" value="${text}">
  `

  if(done) li.classList.add("done")
  if(!text) li.dataset.new = true

  const bullet = li.querySelector(".bullet")

  // DONE TOGGLE ------------------
  bullet.onclick = e => {
    e.stopPropagation()
    if(li.dataset.new) return

    li.classList.toggle("done")
    bullet.textContent = li.classList.contains("done") ? "✅" : "⬜"

    updateItem(li)
  }

  // EDIT ------------------
  li.onclick = () => {
    li.classList.add("edit")
    const input = li.querySelector("input")
	input.oninput = () => {
	// Text im Span live aktualisieren
	li.querySelector("span:nth-child(2)").textContent = input.value

  // Duplikate sofort prüfen
  markDuplicates()
}	
    input.focus()
    input.select()
  }

  const input = li.querySelector("input")

  input.onblur = () => {
    li.classList.remove("edit")

    if(input.value === ""){
      if(li.dataset.id){
        deleteItem(li.dataset.id)
      }
      li.remove()
      return
    }

    li.querySelector("span:nth-child(2)").textContent = input.value

    if(!li.dataset.id){
      addItem(li, input.value)
    } else {
      updateItem(li)
	  markDuplicates()	
    }

    if(li.dataset.new){
      delete li.dataset.new
      addNew(li.parentNode)
    }
	markDuplicates()
  }

  input.onkeydown = e => {
    if(e.key === "Enter") input.blur()
  }

  // DRAG
  li.ondragstart = () => dragged = li

  return li
}

// NEUES FELD ------------------
function addNew(ul){
  ul.prepend(createItem("", false, ul.id))
}

// LOAD  ----------------------
async function load(){
  const res = await fetch("api.php?action=load", { credentials: "include" })
  const items = await res.json()

  // Alle Listen leeren
  document.querySelectorAll("ul").forEach(ul => ul.innerHTML = "")

  // Items einfügen
  items.forEach(item=>{
    const ul = document.getElementById(item.list)
    if(!ul) return

    ul.appendChild(
      createItem(item.text, item.done == 1, item.list, item.id)
    )
  })

  // Drag & Drop + neue Eingabefelder
  document.querySelectorAll("ul").forEach(ul=>{
    ul.ondragover = e => e.preventDefault()
    ul.ondrop = e => {
      e.preventDefault()
      ul.appendChild(dragged)
      updateItem(dragged)
    }

    addNew(ul)
  })

  // Sortieren (offene nach oben)  ------------------
  document.querySelectorAll("ul").forEach(ul=>{
    sortList(ul)
  })

  // 👉 NEU: erledigte ausblenden, Eingabefelder bleiben sichtbar
  document.querySelectorAll("li").forEach(li => {
    if(li.classList.contains("done") && !li.dataset.new){
      li.style.display = "none"
    } else {
      li.style.display = ""
    }
  })
	
  showDone = false	
}
	
// ADD API ------------------
function addItem(li, text){
  fetch("api.php?action=add", {
    method:"POST",
    credentials: "include",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      text: text,
      list: li.parentNode.id,
      pos: 0
    })
  })
  .then(res=>res.text())
  .then(id=>{
    li.dataset.id = id
  })
}

// UPDATE API ------------------
function updateItem(li){
  fetch("api.php?action=update", {
    method:"POST",
    credentials: "include",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({
      id: li.dataset.id,
      text: li.querySelector("span:nth-child(2)").textContent,
      done: li.classList.contains("done") ? 1 : 0,
      list: li.parentNode.id,
      pos: 0
    })
  })
}

// 🗑 DELETE API ------------------
function deleteItem(id){
  fetch("api.php?action=delete", {
    method:"POST",
    credentials: "include",
    headers:{"Content-Type":"application/json"},
    body: JSON.stringify({id})
  })
}

// 🗑 erledigte löschen ------------------
function clearDone(){
  document.querySelectorAll("li.done").forEach(li=>{
    if(li.dataset.id){
      deleteItem(li.dataset.id)
    }
    li.remove()
	markDuplicates()
  })
}

// FILTER ------------------
function filterItems(text){
  text = text.toLowerCase()

  document.querySelectorAll("li").forEach(li=>{
    const name = li.querySelector("span:nth-child(2)").textContent.toLowerCase()
    li.style.display = name.includes(text) ? "" : "none"
  })
}

// Duplikate markieren  ------------------
function markDuplicates(){
  const map = {}

  document.querySelectorAll("li").forEach(li=>{
    let text = li.querySelector("span:nth-child(2)").textContent.trim().toLowerCase()

    // Platzhalter ignorieren
    if(!text || text === "___________________") return

    if(!map[text]){
      map[text] = []
    }
    map[text].push(li)
  })

  // Reset
  document.querySelectorAll("li").forEach(li=>{
    li.classList.remove("duplicate")
  })

  // Markieren
  Object.values(map).forEach(group=>{
    if(group.length > 1){
      group.forEach(li=>{
        li.classList.add("duplicate")
      })
    }
  })
}

// Liste sortieren ------------------
function sortList(ul){
  const items = Array.from(ul.querySelectorAll("li"))

  items.sort((a, b) => {
    const aDone = a.classList.contains("done")
    const bDone = b.classList.contains("done")

    // Nicht erledigt (false) kommt vor erledigt (true)
    return aDone - bDone
  })

  items.forEach(item => ul.appendChild(item))
}
	
// Liste toggeln ------------------
function toggleList(id){
  document.getElementById(id).classList.toggle("hidden")
}	

// Erledigte anzeigen ------------------
let showDone = false

function toggleDone(){
  showDone = !showDone

  document.querySelectorAll("li").forEach(li => {
    // 👉 Eingabefelder IMMER sichtbar lassen
    if(li.dataset.new) {
      li.style.display = ""
      return
    }

    // 👉 erledigte ein-/ausblenden
    if(li.classList.contains("done")){
      li.style.display = showDone ? "" : "none"
    } else {
      li.style.display = ""
    }
  })
}
	
// Text des Buttons "Erledigte anzeigen" togglen ------------------
function toggleDone(){
  showDone = !showDone

  event.target.textContent = showDone 
    ? "🙈 Erledigte ausblenden" 
    : "👁️ Erledigte anzeigen"

  document.querySelectorAll("li").forEach(li => {
    if(li.dataset.new) {
      li.style.display = ""
      return
    }

    if(li.classList.contains("done")){
      li.style.display = showDone ? "" : "none"
    } else {
      li.style.display = ""
    }
  })
}	
	
	
// START ------------------
checkLogin()
	
// Dupliakte markieren	 ------------------
markDuplicates()
</script>

</div>
</body>
</html>
